events {
    worker_connections 1024;
}

http {
    include       /etc/nginx/mime.types;
    default_type  application/octet-stream;

    # --- NOUVEAU : abaisse le seuil de logs pour voir les messages "warn" ---
    error_log /dev/stderr warn;

   limit_req_zone $binary_remote_addr zone=req_zone:10m rate=10r/s;
   limit_conn_zone $binary_remote_addr zone=conn_zone:10m;
   limit_req_log_level warn;
   limit_conn_log_level warn;

    upstream vote_app {
        server frontend-global:5000;
    }

    upstream result_app {
        server frontend-global:4000;
    }

    server {
        listen 80;
        server_name localhost;

        limit_req zone=req_zone burst=20 nodelay;
        limit_conn conn_zone 10;

        location / {
            proxy_pass http://vote_app;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
        }
    }

    server {
        listen 81;
        server_name localhost;

        location /socket.io/ {
            limit_req zone=req_zone burst=40 nodelay;
            limit_conn conn_zone 30;

            proxy_pass http://result_app;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_http_version 1.1;
            proxy_set_header Upgrade $http_upgrade;
            proxy_set_header Connection "Upgrade";
        }

        location / {
            limit_req zone=req_zone burst=20 nodelay;
            limit_conn conn_zone 10;

            proxy_pass http://result_app;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
        }
    }
}
